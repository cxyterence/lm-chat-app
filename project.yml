name: LMChat
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
packages:
  LMChat:
    path: .
targets:
  LMChat:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LMChat
        product: ChatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.lmchat
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - com.local.lmchat.reply.*
        CFBundleDisplayName: LM Chat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: LM Chat connects to language model servers on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
